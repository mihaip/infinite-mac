[project]
name = "infinite-mac"
version = "0.1.0"
description = "Infinite Mac build tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "machfs @ git+https://github.com/mihaip/machfs.git@5f1572f0fb85310d6cc0dd6d55eb5fd41318ecb7",
    "beautifulsoup4==4.12.2",
    "Pillow>=13.0.0",
    "xattr==1.1.4",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.88",
]

[tool.ruff]
include = ["pyproject.toml", "scripts/**/*.py"]
src = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.src]
include = ["scripts"]

[tool.ty.environment]
root = ["scripts"]
